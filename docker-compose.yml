services:
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: booksdb
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  node:
    build: .
    container_name: nodeapp
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ENV=production
      - MONGO_URI=mongodb://mongodb:27017/booksdb
    depends_on:
      - mongodb
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
